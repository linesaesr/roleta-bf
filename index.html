<!DOCTYPE html>
<html>
  <head>
    <title>Roleta de Ofertas </title>
    <!--- ROLETA DE CUPONS E DESCONTOS -->
    
    <!--- Link to styles in CSS tab -->
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <style>
    .ir-wrap{font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;color:#0f172a;background:#fff;border:1px
    solid #e5e7eb;border-radius:16px;box-shadow:0 6px 20px rgba(2,6,23,.06);padding:18px;max-width:640px;margin:16px
    auto;text-align:center}
    .ir-title{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:8px}
    .ir-dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#3b82f6)}
    .ir-title h3{margin:0;font-size:18px;font-weight:800}
    .ir-pointer{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:25px
    solid #ef4444;margin:0 auto;position:relative;bottom:-25px;z-index:10}
    .ir-wheel{width:260px;height:260px;border-radius:50%;border:10px solid #f1f5f9;margin:10px
    auto;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px #e2e8f0;transform:rotate(0deg)}
    .ir-slice{position:absolute;inset:0;background:var(--bg);clip-path:polygon(50% 50%,100% 0,100%
    100%);transform-origin:50% 50%;transform:rotate(var(--rot))
    skewY(-45deg);display:flex;align-items:center;justify-content:center}
    .ir-slice span{transform:skewY(45deg) rotate(calc(var(--rot) *
    -1));font-weight:800;color:#334155;font-size:14px;text-align:center}
    .ir-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#334155}
    .ir-actions{display:flex;gap:10px;justify-content:center;margin-top:10px}
    .ir-btn{appearance:none;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}
    .ir-btn.primary{background:#3b82f6;color:#fff}
    .ir-btn.ghost{background:#f1f5f9}
    .ir-res{margin-top:12px;border-top:1px dashed #e2e8f0;padding-top:10px}
    .ir-picked{display:inline-block;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:8px
    10px;font-weight:700;margin-bottom:8px}
    .ir-cta{display:inline-block;margin-top:6px;background:#0ea5e9;color:#fff;border-radius:10px;padding:10px
    14px;font-weight:800;text-decoration:none}
    .ir-foot{margin-top:6px;color:#64748b;font-size:12px}
  .ir-labels{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:2;
  }
  .ir-label{
  position:absolute;
  left:50%;
  top:50%;
  transform-origin:50% 50%;
  text-align:center;
  font-weight:800;
  color:#334155;
  font-size:12px;
  line-height:1.2;
  }
  .ir-label span{
  display:inline-block;
  background:rgba(255,255,255,.9);
  padding:1px 1px;
  border-radius:10px;
  white-space:nowrap;
  }
    
  </style>
  </head>
  <body>
    <!--- Paste HTML below here -->
<section id="intent-roulette" class="ir-wrap" aria-label="Roleta de intenções">
  <div class="ir-title">
    <i aria-hidden="true"></i>
    <div>
      <h2 style="margin:0;font-size:22px;font-weight:800;color:#111827">
        Roleta Black Friday
      </h2>
      <h3 style="margin:2px 0 0;font-size:16px;font-weight:600;color:#374151">
        Gire e destrave ofertas incríveis!
      </h3>
    <!-- Ponteiro fixo -->
    <div class="ir-pointer"></div>
    
    <!-- Roleta -->
    <div class="ir-wheel" id="ir-wheel">
      <div class="ir-labels" id="ir-labels"></div> <!-- ESTE AQUI -->
      <div class="ir-center"></div>
    </div>
    
    <div class="ir-actions">
      <button class="ir-btn primary" id="ir-spin">Girar roleta</button>
      <button class="ir-btn ghost" id="ir-reset">Tentar novamente</button>
    </div>
    
    <div class="ir-res" id="ir-res" hidden>
      <div class="ir-picked">
        <strong>Você caiu em:</strong> <span id="ir-intent">—</span>
      </div>
      <a class="ir-cta" id="ir-link" href="#" rel="nofollow">Ver recomendações →</a>
      <div class="ir-foot">Os resultados aparecerão após um anúncio.</div>
    </div>
    

    </body>

    <script>
    (function(){
      // Mapeie aqui as URLs dos seus RECs
      const TARGETS = [
      { label:'Smartwatch', url:'https://cursosparainiciantes.com.br/cow-produtos-br/?keyword=smartwach+oferta+' },
      { label:'Headphone', url:'https://cursosparainiciantes.com.br/cow-produtos-br/?keyword=headphone+bluetooth+oferta+' },
      { label:'Airfryer', url:'https://cursosparainiciantes.com.br/cow-produtos-br/?keyword=airfryer+4l+promocao+' },
      { label:'Cadeira Gamer', url:'https://cursosparainiciantes.com.br/cow-produtos-br/?keyword=cadeira+gamer+ergonomica+' }
      ];
      // Se quiser passar parâmetros fixos ao widget (ex.: KWs), pode anexar: ?kw=smartwatch,descontos
      
      const wheel = document.getElementById('ir-wheel');
      const labelsBox = document.getElementById('ir-labels');
      const spin = document.getElementById('ir-spin');
      const reset = document.getElementById('ir-reset');
      const res = document.getElementById('ir-res');
      const picked = document.getElementById('ir-intent');
      const link = document.getElementById('ir-link');
      // ====== Desenha fundo (fatias) e rótulos ======
  const colors = ['#fecaca','#fde68a','#bbf7d0','#bfdbfe','#ddd6fe','#fbcfe8','#a7f3d0','#fef08a'];
  function paintWheel(){
    const n = TARGETS.length;
    const step = 360 / n;
    // conic-gradient com cores alternadas
    const parts = [];
    for(let i=0;i<n;i++){
      const a0 = i*step, a1 = (i+1)*step;
      const col = colors[i % colors.length];
      parts.push(`${col} ${a0}deg ${a1}deg`);
    }
    wheel.style.background = `conic-gradient(${parts.join(',')})`;
    // rótulos
    labelsBox.innerHTML = '';
  const radius = (wheel.clientWidth / 2) -50; // raio útil (ajuste fino)
  for (let i = 0; i < n; i++) {
    const theta = i * step + step / 2; // meio da fatia
    const el = document.createElement('div');
    el.className = 'ir-label';
    // empurra cada label para fora usando PX, não %
    el.style.transform =
      `translate(-50%,-50%) rotate(${theta}deg) translate(0, -${radius}px) rotate(${-theta}deg)`;
    el.innerHTML = `<span>${TARGETS[i].label}</span>`;
    labelsBox.appendChild(el);
    }
  }
  paintWheel();
      
      let spinning = false;
      
      function pickTarget(){
      const i = Math.floor(Math.random() * TARGETS.length);
      return { index:i, ...TARGETS[i] };
      }
      
      function spinWheel(){
      if(spinning) return;
      spinning = true;
      
      const chosen = pickTarget();
      const sectorAngle = 360 / TARGETS.length; // 90°
      const base = chosen.index * sectorAngle + sectorAngle/2;
      const rounds = 5 * 360; // voltas completas
      const target = rounds + (360 - base); // para parar com a fatia escolhida no topo
      
      wheel.style.transition = 'transform 2.2s cubic-bezier(.2,.7,.1,1)';
      wheel.style.transform = `rotate(${target}deg)`;
      
      setTimeout(()=>{
      spinning = false;
      picked.textContent = chosen.label;
      link.href = chosen.url;
      res.hidden = false;
      }, 2300);
      }
      
      spin.addEventListener('click', spinWheel);
      reset.addEventListener('click', ()=>{
      wheel.style.transition = 'none';
      wheel.style.transform = 'rotate(0deg)';
      res.hidden = true;
      });
      })();
    </script>
  </body>
</html>
